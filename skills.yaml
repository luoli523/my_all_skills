# Skills Manager Configuration
# Run ./install.sh to clone repos and create symlinks to ~/.claude/skills/,
# 或通过 Claude Code 自带的 plugin 机制安装 (install_mode: plugin)。

clone_dir: .repos
plugin_state_file: .plugin_state.json   # 记录 install.sh 管理过的 marketplace/plugin

# Skills symlinks 会同时创建到下列所有目录（Claude Code + Codex 等）
# 注意: install_mode: plugin 的 repo 不会写入这些目录, 由 Claude Code plugin 系统接管。
skills_dir:
  - ~/.claude/skills
  - ~/.codex/skills

repos:
  # install_mode:
  #   - symlink (default): clone 到 .repos/ 并 symlink 到 skills_dir。
  #   - plugin: 调用 `claude plugin` CLI 注册 marketplace + 安装 plugin。
  #             Codex 端不部署。需声明 marketplace 和 plugin 的 name 字段
  #             (从 repo 的 .claude-plugin/marketplace.json 读取)。
  #
  # symlink 模式可选: enabled / enabled_skills / skills_path / prefix / single_skill。
  # plugin 模式必填: url + marketplace + plugin。

  awesome-claude-skills:
    install_mode: symlink
    enabled: false
    url: https://github.com/ComposioHQ/awesome-claude-skills.git
    branch: master
    skills_path: "."           # each top-level dir with SKILL.md is a skill
    # enabled_skills:
    #   - webapp-testing

  remotion-skills:
    install_mode: symlink
    enabled: true
    url: https://github.com/remotion-dev/skills.git
    branch: main
    skills_path: "skills"      # skills nested under skills/ subdir

  baoyu-skills:
    install_mode: plugin
    url: https://github.com/JimLiu/baoyu-skills.git
    marketplace: baoyu-skills
    plugin: baoyu-skills
    description: >
      暴雨(baoyu)系列 Skills 合集，包含图片生成、漫画创作、封面设计、
      信息图、幻灯片、文章配图、图片压缩、网页转 Markdown、
      发布微信公众号/X(Twitter) 等 15 个 skills

  agent-skills:
    install_mode: plugin
    url: https://github.com/addyosmani/agent-skills.git
    marketplace: addy-agent-skills
    plugin: agent-skills
    description: >
      Addy Osmani 的 Agent Skills 合集，覆盖开发全生命周期：
      规划、实现、测试、代码审查、性能优化、安全加固、发布等 20 个 skills

  anything-to-notebooklm:
    install_mode: symlink
    enabled: true
    url: https://github.com/joeseesun/anything-to-notebooklm.git
    branch: main
    single_skill: true         # repo itself is the skill (SKILL.md at root)
    description: >
      多源内容智能处理器：支持微信公众号、网页、YouTube、PDF、Markdown等，
      自动上传到 NotebookLM 并生成播客/PPT/思维导图等多种格式

local:
  - huiwang-writing-style
